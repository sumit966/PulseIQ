name: PulseIQ CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 --max-line-length=100 --extend-ignore=E203,W503 core app.py pages || true

      - name: Import smoke test
        env:
          USE_LLM: "false"
          LLM_PROVIDER: "dummy"
        run: |
          python -c "import core.config, core.data_generator, core.kafka_sim, core.database, core.ml_pipeline, core.ai_insights; print('Imports OK')"

      - name: Run pipeline smoke test
        env:
          USE_LLM: "false"
        run: |
          python -c "
          from core.database import init_db, insert_events, fetch_recent
          from core.data_generator import generate_event
          from core.ml_pipeline import clean_and_enrich, predict_churn
          init_db()
          insert_events([generate_event() for _ in range(20)])
          df = clean_and_enrich(fetch_recent(50))
          df = predict_churn(df)
          assert len(df) > 0
          assert 'prediction' in df.columns
          print('Pipeline OK:', len(df), 'rows')
          "

      - name: Build Docker image
        run: docker build -t pulseiq:ci .
